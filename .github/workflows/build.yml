name: build
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - "**.sh"
      - Dockerfile
      - .nofp
      - "patches/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        id: build
        continue-on-error: true
        uses: ./
      - name: Build without fingerprinting (fallback)
        if: ${{ steps.build.outcome == 'failure' }}
        uses: ./
        env:
          NGX_FP_FORCE_NOFP: "1"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ env.nginx_version }}${{ env.fp_state }}
          path: |
            /home/runner/work/_temp/_github_home/nginx.deb
            /home/runner/work/_temp/_github_home/nginx-dbg.deb
      - name: Release
        if: ${{ env.change }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /home/runner/work/_temp/_github_home/nginx.deb
            /home/runner/work/_temp/_github_home/nginx-dbg.deb
          fail_on_unmatched_files: true
          body: ${{ env.release_note }}
          tag_name: v${{ env.release_version }}
          name: ${{ env.release_title }}
          make_latest: true
          generate_release_notes: false
      - name: Update
        if: ${{ env.change }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update hash and version
      - name: Fingerprint missing
        if: ${{ (env.fp_tier == '3' && env.change) || steps.build.outcome == 'failure' }}
        run: |
          if [ -n "$change" ] && [ -n "$fp_state" ]; then
            echo "::error title=JA3/JA4 fingerprint omitted::nginx $nginx_version was published as v$release_version without the fingerprint module: $fp_note. Check the Build step log and https://github.com/phuslu/nginx-ssl-fingerprint/tree/master/patches"
          else
            echo "::error title=Fingerprinted build failed::nothing was published, servers keep their current release. See the failed Build step."
          fi
          exit 1
